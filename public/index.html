<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创作台 · Agnes Studio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="page-head">
      <div>
        <h1><span class="grad">创作台</span></h1>
        <p class="sub">文生图 · 文生视频 · 首尾帧 · 参考图 —— Agnes 2.5 Flash 全参数直通</p>
      </div>
      <a class="btn btn-ghost" href="/tasks.html">我的任务 →</a>
    </div>

    <!-- 模式切换 -->
    <div class="seg" id="modeSeg">
      <button type="button" class="seg-btn active" data-mode="image"><span class="ic">✦</span>文生图</button>
      <button type="button" class="seg-btn" data-mode="text"><span class="ic">▶</span>文生视频</button>
      <button type="button" class="seg-btn" data-mode="keyframe"><span class="ic">⧉</span>首尾帧</button>
      <button type="button" class="seg-btn" data-mode="reference"><span class="ic">⌘</span>参考图</button>
    </div>

    <div class="layout-2col">
      <!-- 左：创作表单 -->
      <section class="card panel">
        <form id="createForm" novalidate>
          <!-- 提示词 -->
          <div class="field">
            <label for="promptBox">提示词</label>
            <textarea id="promptBox" name="prompt" rows="5"></textarea>
            <div class="hint" id="promptHint"></div>
          </div>

          <!-- 首尾帧上传 -->
          <div class="field hidden" id="keyframeBox">
            <label>首帧 / 尾帧图片</label>
            <div class="upload-row">
              <div class="upload" data-slot="first_frame">
                <span class="up-tag req">首帧</span>
                <div class="up-empty"><span class="plus">+</span>点击上传首帧</div>
                <img class="up-prev" alt="首帧预览" hidden>
                <button type="button" class="up-x" title="移除">×</button>
                <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
              </div>
              <div class="upload" data-slot="last_frame">
                <span class="up-tag">尾帧（可选）</span>
                <div class="up-empty"><span class="plus">+</span>点击上传尾帧</div>
                <img class="up-prev" alt="尾帧预览" hidden>
                <button type="button" class="up-x" title="移除">×</button>
                <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
              </div>
            </div>
            <div class="hint">至少上传<b>首帧或尾帧之一</b>；两张都传可精确控制起止画面</div>
          </div>

          <!-- 参考图上传 -->
          <div class="field hidden" id="refBox">
            <label>参考图片 <span class="dim" id="refCount">0 / 5</span></label>
            <div class="up-grid" id="refGrid">
              <button type="button" class="add-tile" id="refAdd">
                <span class="plus">+</span>添加图片
              </button>
            </div>
            <input type="file" id="refInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
            <div class="hint">最多 <b>5</b> 张；提示词中可用 <span class="code">&lt;Picture 1&gt;</span> 指代第一张，如「让 <span class="code">&lt;Picture 1&gt;</span> 中的角色走进画面」</div>
          </div>

          <!-- 视频参数 -->
          <div class="opts" id="videoOpts" hidden>
            <div class="opt">
              <span class="opt-label">时长</span>
              <div class="chips" id="secChips">
                <button type="button" class="chip" data-v="4">4s</button>
                <button type="button" class="chip" data-v="5">5s</button>
                <button type="button" class="chip" data-v="6">6s</button>
                <button type="button" class="chip" data-v="8">8s</button>
                <button type="button" class="chip" data-v="10">10s</button>
                <button type="button" class="chip" data-v="12">12s</button>
              </div>
            </div>
            <div class="opt">
              <span class="opt-label">尺寸</span>
              <div class="chips" id="sizeChips">
                <button type="button" class="chip active" data-v="720P">720P <span class="dim">免费</span></button>
                <button type="button" class="chip" data-v="1080P">1080P</button>
                <button type="button" class="chip" data-v="1K">1K</button>
                <button type="button" class="chip" data-v="2K">2K</button>
              </div>
            </div>
            <div class="opt">
              <span class="opt-label">画幅</span>
              <div class="chips" id="arChips">
                <button type="button" class="chip active" data-v="16:9">16:9</button>
                <button type="button" class="chip" data-v="21:9">21:9</button>
                <button type="button" class="chip" data-v="4:3">4:3</button>
                <button type="button" class="chip" data-v="1:1">1:1</button>
                <button type="button" class="chip" data-v="3:4">3:4</button>
                <button type="button" class="chip" data-v="9:16">9:16 竖屏</button>
              </div>
            </div>
          </div>

          <!-- 图像参数 -->
          <div class="opts" id="imageOpts">
            <div class="opt">
              <span class="opt-label">尺寸</span>
              <div class="chips" id="imgSizeChips">
                <button type="button" class="chip active" data-v="1K">1K</button>
                <button type="button" class="chip" data-v="2K">2K</button>
                <button type="button" class="chip" data-v="3K">3K</button>
                <button type="button" class="chip" data-v="4K">4K</button>
              </div>
            </div>
            <div class="opt">
              <span class="opt-label">比例</span>
              <div class="chips" id="ratioChips">
                <button type="button" class="chip active" data-v="1:1">1:1</button>
                <button type="button" class="chip" data-v="3:4">3:4</button>
                <button type="button" class="chip" data-v="4:3">4:3</button>
                <button type="button" class="chip" data-v="16:9">16:9</button>
                <button type="button" class="chip" data-v="9:16">9:16</button>
                <button type="button" class="chip" data-v="2:3">2:3</button>
                <button type="button" class="chip" data-v="3:2">3:2</button>
                <button type="button" class="chip" data-v="21:9">21:9</button>
              </div>
            </div>
          </div>

          <!-- 高级 JSON -->
          <details class="adv">
            <summary>高级参数 JSON（覆盖上方选择，支持 Agnes 官方全部参数）</summary>
            <div class="adv-body">
              <textarea id="advJson" spellcheck="false" placeholder='{"seed": 42, "seconds": "8", "first_frame": "https://..."}'></textarea>
              <div class="hint">会与上方表单合并（此处优先生效），仅支持单层对象</div>
            </div>
          </details>

          <div class="form-foot">
            <div class="estimate" id="estimate"></div>
            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">✦ 立即生成</button>
          </div>
        </form>
        <div id="msg" class="form-error"></div>
      </section>

      <!-- 右：侧栏 -->
      <aside class="side">
        <div class="card side-card">
          <h3><span class="ic">◈</span><span id="tipTitle">模式说明</span></h3>
          <ul class="tip-list" id="modeTip"></ul>
        </div>
        <div class="card side-card">
          <h3><span class="ic">◷</span>最近任务</h3>
          <div class="recent-list" id="recent">
            <div class="dim" style="font-size:13.5px">加载中…</div>
          </div>
          <div class="side-foot"><a href="/tasks.html">全部任务 →</a></div>
        </div>
      </aside>
    </div>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/create.js"></script>
</body>
</html>
