<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Agnes Studio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="logo-mark">A</span>
          <h1>欢迎回来</h1>
          <p>登录后开始创作 · 视频与图像生成</p>
        </div>
        <form id="loginForm">
          <div class="field">
            <label for="email">邮箱</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" placeholder="输入密码" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">登 录</button>
          <div id="msg" class="form-error"></div>
        </form>
        <div class="auth-foot">还没有账号？<a href="/register.html">立即注册 →</a></div>
      </div>
    </div>
  </main>
  <script src="/js/auth.js"></script>
  <script>bindLogin();</script>
</body>
</html>
